{% extends "admin/base.html" %}

{% block title %}Clone Page{% endblock %}
{% block page_title %}Clone Page - {{ page.title }}{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <div>
            <h2 class="card-title mb-1"><i class="bi bi-files me-2"></i>Clone Page</h2>
            <small class="text-muted">{{ page.title }} (from {{ page.college.name }})</small>
        </div>
        <a href="/admin/colleges/{{ page.college.id }}/pages" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> Back to Pages
        </a>
    </div>

    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Target College *</label>
                <select name="target_college_id" class="form-select" required>
                    {% for c in colleges %}
                    <option value="{{ c.id }}">{{ c.name }} ({{ c.slug }})</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-4">
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" name="is_active" value="true" id="isActiveSwitch" checked>
                    <label class="form-check-label" for="isActiveSwitch">
                        <strong>Active</strong> <small class="text-muted">- Cloned page will be active in the target college</small>
                    </label>
                </div>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-save"></i> Clone Page
                </button>
                <a href="/admin/colleges/{{ page.college.id }}/pages" class="btn btn-secondary">
                    <i class="bi bi-x-circle"></i> Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

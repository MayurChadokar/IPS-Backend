{% extends "admin/base.html" %}

{% block title %}Login{% endblock %}

{% block login_content %}
<style>
    .login-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #002147;
        padding: 20px;
    }

    .login-card {
        background: white;
        padding: 48px;
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        width: 100%;
        max-width: 440px;
        animation: slideUp 0.4s ease;
    }

    @keyframes slideUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .login-header {
        text-align: center;
        margin-bottom: 36px;
    }

    .login-header h1 {
        font-size: 32px;
        font-weight: 800;
        color: #0f172a;
        margin-bottom: 8px;
    }

    .login-header p {
        color: #64748b;
        font-size: 15px;
        font-weight: 500;
    }

    .login-logo {
        font-size: 64px;
        margin-bottom: 24px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    .login-card .form-control {
        padding: 12px 16px;
        font-size: 15px;
    }

    .login-card .btn-primary {
        padding: 14px;
        font-size: 16px;
        font-weight: 700;
    }
</style>

<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">
                <img src="https://ipsacademyindore.edu.in/assets/logo-PPc3lnuf.png" alt="Logo" width="100%" height="100%">
            </div>
            <h1>Admin Login</h1>
            <p>Multi-College CMS</p>
        </div>

        {% if error %}
        <div class="alert alert-danger mb-4">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/admin/login">
            <div class="mb-3">
                <label class="form-label">Username or Email</label>
                <input type="text" name="username" class="form-control" placeholder="admin or admin@ipsa.edu" required
                    autofocus>
            </div>

            <div class="mb-4">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-box-arrow-in-right me-2"></i>Login
            </button>
        </form>
    </div>
</div>
{% endblock %}

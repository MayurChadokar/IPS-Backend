{% extends "admin/base.html" %}

{% block title %}{{ action }} Course{% endblock %}
{% block page_title %}{{ action }} Course - {{ college.name }}{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <div>
            <h2 class="card-title mb-1"><i class="bi bi-mortarboard me-2"></i>{{ action }} Course</h2>
            <small class="text-muted">{{ college.name }}</small>
        </div>
        <a href="/admin/colleges/{{ college.id }}/courses" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> Back to Courses
        </a>
    </div>

    <div class="card-body">
        <form method="POST">
            <input type="hidden" name="college_id" value="{{ college.id }}">

            <div class="row">
                <div class="col-md-8">
                    <div class="mb-3">
                        <label class="form-label">Course Name *</label>
                        <input type="text" name="name" class="form-control" value="{{ course.name if course else '' }}"
                            required placeholder="e.g., Bachelor of Technology in Computer Science">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control" rows="4"
                            placeholder="Detailed description of the course...">{{ course.description if course else '' }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Eligibility Criteria</label>
                        <textarea name="eligibility" class="form-control" rows="3"
                            placeholder="e.g., 10+2 with 50% marks in Physics, Chemistry, and Mathematics">{{ course.eligibility if course else '' }}</textarea>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="mb-3">
                        <label class="form-label">Fee Structure (JSON)</label>
                        <textarea name="fee_structure" id="fee_structure" class="form-control font-monospace" rows="10"
                            placeholder='{
  "year_1": 50000,
  "year_2": 50000
}'>{{ course.fee_structure | tojson(indent=2) if course and course.fee_structure else '{}' }}</textarea>
                        <small class="text-muted d-block mt-2">Enter valid JSON format.</small>
                        <button type="button" class="btn btn-sm btn-outline-secondary mt-2"
                            onclick="formatJSON()">Format JSON</button>
                    </div>
                </div>
            </div>

            <hr class="my-4">

            <div class="mb-4">
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" name="is_active" value="true" id="isActiveSwitch" {%
                        if not course or course.is_active %}checked{% endif %}>
                    <label class="form-check-label" for="isActiveSwitch">
                        <strong>Active</strong> <small class="text-muted">- Course will be listed on the website</small>
                    </label>
                </div>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-save"></i> {{ action }} Course
                </button>
                <a href="/admin/colleges/{{ college.id }}/courses" class="btn btn-secondary">
                    <i class="bi bi-x-circle"></i> Cancel
                </a>
            </div>
        </form>
    </div>
</div>

<script>
    function formatJSON() {
        const textarea = document.getElementById('fee_structure');
        try {
            const val = JSON.parse(textarea.value);
            textarea.value = JSON.stringify(val, null, 2);
        } catch (e) {
            alert('Invalid JSON: ' + e.message);
        }
    }
</script>
{% endblock %}
